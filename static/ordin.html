<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자치법규 조문 검색</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-wash" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-kicker">자치법규 범위 검색</p>
          <h1 class="brand-title" id="page-title">자치법규 조문 검색</h1>
        </div>
      </div>
      <a class="source-link" href="/home" rel="noopener noreferrer">법률 목록으로</a>
    </header>

    <main class="shell shell-wide">
      <section class="hero law-scope-hero">
        <p class="hero-lead" id="scope-lead">
          이 창에서는 선택한 <em>자치법규(조례 등)</em> 안에서
          키워드가 포함된 조문을 법률 3단 검색과 같은 형태로 보여 줍니다.
        </p>

        <div class="scope-pill" id="scope-pill" hidden></div>

        <form id="search-form" class="search-form" autocomplete="off">
          <label class="sr-only" for="query">검색어</label>
          <div class="search-bar" id="search-bar">
            <input
              id="query"
              name="query"
              type="search"
              placeholder="이 자치법규에서 찾을 키워드"
              maxlength="200"
              required
            />
            <button type="submit" id="search-btn">조문 검색</button>
            <button type="button" id="open-all-btn" class="ghost-btn" hidden>전체 조문</button>
          </div>
        </form>
      </section>

      <section id="status" class="status" hidden></section>
      <section id="meta" class="meta" hidden></section>
      <section id="ordin-list" class="law-list" aria-live="polite"></section>

      <section id="workspace" class="workspace" hidden>
        <section id="compare" class="compare" aria-live="polite"></section>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        데이터 출처:
        <a href="https://www.law.go.kr" target="_blank" rel="noopener noreferrer">국가법령정보센터</a>
        · 법제처(<a href="https://www.moleg.go.kr" target="_blank" rel="noopener noreferrer">www.moleg.go.kr</a>)
      </p>
    </footer>

    <script src="/static/ordin.js" type="module"></script>
    <script>
      // 메인 스크립트 로드 실패 시에도 목록이 비지 않도록 보조 부트
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          const list = document.getElementById("ordin-list");
          if (!list || list.dataset.ready === "1" || list.innerHTML.trim()) return;
          const q = new URLSearchParams(location.search).get("q") || "";
          if (!q) return;
          const status = document.getElementById("status");
          if (status) {
            status.hidden = false;
            status.textContent = "자치법규를 검색하는 중입니다…";
          }
          fetch(`/api/ordinances?q=${encodeURIComponent(q)}&display=50`)
            .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
            .then(({ ok, d }) => {
              if (!ok) throw new Error(d.detail || "검색 실패");
              if (typeof window.__ordinBoot === "function") {
                window.__ordinBoot(d);
                return;
              }
              const items = (d.ordinances || []).filter((item) => Number(item?.hitCount || 0) > 0);
              if (status) {
                status.hidden = true;
                status.textContent = "";
              }
              list.innerHTML = items.length
                ? `<div class="law-list-head"><h2>자치법규 선택</h2></div><div class="law-grid">${items
                    .map(
                      (item) =>
                        `<a class="law-card" href="/ordin?q=${encodeURIComponent(q)}&mst=${encodeURIComponent(
                          item.mst || ""
                        )}&name=${encodeURIComponent(item.ordinName || "")}"><span class="badge 자치법규">자치법규</span><strong class="law-card-title">${
                          item.ordinName || ""
                        }</strong></a>`
                    )
                    .join("")}</div>`
                : `<div class="empty">일치하는 자치법규가 없습니다.</div>`;
              list.dataset.ready = "1";
            })
            .catch((err) => {
              if (status) {
                status.hidden = false;
                status.textContent = err.message || "검색 중 오류";
                status.classList.add("error");
              }
            });
        }, 800);
      });
    </script>
  </body>
</html>
